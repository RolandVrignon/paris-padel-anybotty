<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Anybotty — Le bon terrain. Au bon moment.</title>
  <desc id="desc">Bannière Paris Padel : typographie claire sur fond bleu nuit, terrain de padel dessiné en vert et balle jaune. Observer, choisir, réserver.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091620"/><stop offset="1" stop-color="#132d32"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#94f7b7" stop-opacity=".15"/><stop offset="1" stop-color="#94f7b7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bcdfd3" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="220" r="330" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="52" width="122" height="30" rx="15" fill="#d4fc67"/>
    <text x="125" y="72" text-anchor="middle" fill="#102520" font-size="12" font-weight="700" letter-spacing="2">PARIS PADEL</text>
    <text x="64" y="154" fill="#f5fff9" font-size="64" font-weight="800" letter-spacing="-3">anybotty<tspan fill="#d4fc67">.</tspan></text>
    <text x="64" y="229" fill="#f5fff9" font-size="42" font-weight="700" letter-spacing="-1">Le bon terrain.</text>
    <text x="64" y="280" fill="#d4fc67" font-size="42" font-weight="700" letter-spacing="-1">Au bon moment.</text>
    <text x="64" y="331" fill="#b4c9c6" font-size="19">Tes clubs. Tes préférences. Ton prochain match.</text>
    <path d="M64 378H585" stroke="#b4c9c6" stroke-opacity=".2"/>
    <text x="64" y="414" fill="#e1eee9" font-size="13" letter-spacing="2">OBSERVER</text>
    <text x="191" y="414" fill="#d4fc67" font-size="15">→</text>
    <text x="230" y="414" fill="#e1eee9" font-size="13" letter-spacing="2">CHOISIR</text>
    <text x="342" y="414" fill="#d4fc67" font-size="15">→</text>
    <text x="381" y="414" fill="#e1eee9" font-size="13" letter-spacing="2">RÉSERVER</text>
  </g>
  <g transform="translate(793 62) rotate(9 164 175)">
    <rect x="-18" y="-18" width="364" height="388" rx="24" fill="#9be3bf" fill-opacity=".03" stroke="#9be3bf" stroke-opacity=".13"/>
    <rect width="328" height="352" rx="4" fill="#1a4b43" stroke="#9be3bf" stroke-width="2"/>
    <path d="M0 90H328M0 262H328M164 90V262" stroke="#b6efd6" stroke-width="2" fill="none"/>
    <path d="M-12 176H340" stroke="#e7faef" stroke-width="3" stroke-dasharray="3 4"/>
    <path d="M70 295Q232 230 236 90" fill="none" stroke="#d4fc67" stroke-width="2" stroke-dasharray="7 9" opacity=".6"/>
    <circle cx="236" cy="90" r="26" fill="#d4fc67" fill-opacity=".1"/>
    <circle cx="236" cy="90" r="12" fill="#d4fc67"/>
    <path d="M229 81Q240 91 228 98M244 82Q233 89 246 96" stroke="#648c32" stroke-width="1.4" fill="none"/>
    <circle cx="70" cy="295" r="6" fill="#d4fc67" fill-opacity=".5"/>
  </g>
</svg>
